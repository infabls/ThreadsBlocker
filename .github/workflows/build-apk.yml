name: Build APK

on:
  workflow_dispatch:        # вручную: вкладка Actions -> Build APK -> Run workflow
  push:
    tags: ['v*']            # git tag v1.0.0 && git push --tags -> APK попадёт в Releases

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости и сборка веб-части
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ThreadsBlocker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ThreadsBlocker-apk
          path: ThreadsBlocker.apk

      - name: Релиз с APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ThreadsBlocker.apk
          generate_release_notes: true
