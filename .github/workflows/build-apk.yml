name: Build APK

on:
  workflow_dispatch:        # вручную: вкладка Actions -> Build APK -> Run workflow
  push:
    tags: ['v*']            # git tag v1.0.0 && git push --tags -> APK попадёт в Releases

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Версия из тега
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "window.APP_VERSION = '${GITHUB_REF_NAME#v}';" > src/version.js

      - name: Зависимости и сборка веб-части
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec cap sync android

      - name: Сборка APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            # постоянный ключ: обновления ставятся поверх старой версии, данные не теряются
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../ThreadsBlocker.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../ThreadsBlocker.apk
          fi

      - name: Архив веб-части для автообновления
        run: cd src && zip -qr ../ThreadsBlocker-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ThreadsBlocker-apk
          path: |
            ThreadsBlocker.apk
            ThreadsBlocker-web.zip

      - name: Релиз с APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ThreadsBlocker.apk
            ThreadsBlocker-web.zip
          generate_release_notes: true
