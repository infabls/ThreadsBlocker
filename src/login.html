<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ThreadsBlocker</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Вход в Threads <small id="ver"></small></h1>
  <input id="username" placeholder="Имя пользователя" autocapitalize="none" autocomplete="username">
  <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
  <label style="display:block;margin-bottom:12px;font-size:14px"><input id="remember" type="checkbox" checked style="width:auto;margin:0 8px 0 0">Запомнить на этом устройстве</label>
  <div id="error"></div>
  <button id="login">Войти</button>
  <p style="font-size:12px;color:#9aa0b8;margin-top:14px">Неофициальное приложение, использование на свой риск, без гарантий. Мы не собираем данные: логин и пароль уходят только в Instagram. <a href="https://github.com/infabls/ThreadsBlocker/blob/master/PRIVACY.md" style="color:#00e1ff">Конфиденциальность</a> · <a href="https://github.com/infabls/ThreadsBlocker/blob/master/DISCLAIMER.md" style="color:#00e1ff">Отказ от ответственности</a></p>
  <script src="version.js"></script>
  <script src="update.js"></script>
  <script src="storage.js"></script>
  <script>document.getElementById('ver').textContent = 'v' + (window.APP_VERSION || '?');</script>
  <script src="bundle.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    Storage.get('session').then((s) => { if (s) location.replace('main.html'); });
    $('login').onclick = async () => {
      const username = $('username').value.trim(), password = $('password').value;
      if (!username || !password) { $('error').textContent = 'Введите логин и пароль'; return; }
      $('login').disabled = true; $('error').textContent = '';
      try {
        const session = await TB.login(username, password);
        await Storage.set('session', JSON.stringify(session));
        if ($('remember').checked) await Storage.set('creds', JSON.stringify({ u: username, p: password }));
        location.replace('main.html');
      } catch (e) {
        $('error').textContent = e.message;
        $('login').disabled = false;
      }
    };
  </script>
</body>
</html>
