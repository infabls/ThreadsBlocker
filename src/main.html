<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Блокировка — ThreadsBlocker</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Массовая блокировка <small id="ver"></small></h1>
  <textarea id="names" placeholder="Юзернеймы, по одному на строку"></textarea>
  <input id="file" type="file" accept=".txt,text/plain" hidden>
  <button class="secondary" id="load">Загрузить .txt файл</button>
  <button class="danger" id="block">Заблокировать всех</button>
  <progress id="bar" value="0" max="1"></progress>
  <div id="status"></div>
  <div id="log"></div>
  <br>
  <button class="secondary" id="commentsBtn" onclick="location.href='comments.html'">Удалить мои комментарии на чужих постах</button>
  <button class="secondary" id="listBtn">Показать заблокированных</button>
  <div id="blockedBox" hidden>
    <div id="blockedStatus"></div>
    <textarea id="blockedList" readonly></textarea>
    <button class="secondary" id="copyBtn">Скопировать список</button>
  </div>
  <button class="secondary" id="logout">Выйти из аккаунта</button>
  <script src="version.js"></script>
  <script src="update.js"></script>
  <script src="storage.js"></script>
  <script>document.getElementById('ver').textContent = 'v' + (window.APP_VERSION || '?');</script>
  <script src="bundle.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const log = (text) => { const d = document.createElement('div'); d.textContent = text; $('log').prepend(d); };
    const parse = (t) => [...new Set(t.split(/\r?\n/).map((s) => s.trim().replace(/^@/, '')).filter(Boolean))];

    // сессия истекла -> один тихий перевход сохранёнными данными (если пользователь запомнил пароль)
    async function reloginSession() {
      const c = await Storage.get('creds');
      if (!c) return null;
      try {
        const { u, p } = JSON.parse(c);
        const s = await TB.login(u, p);
        await Storage.set('session', JSON.stringify(s));
        return s;
      } catch (e) { return null; }
    }

    async function logout() { await Storage.clear(); location.replace('login.html'); }

    $('load').onclick = () => $('file').click();
    $('file').onchange = async (e) => {
      const f = e.target.files[0];
      if (f) $('names').value = await f.text();
      e.target.value = '';
    };
    $('logout').onclick = logout;

    $('listBtn').onclick = async () => {
      const raw = await Storage.get('session');
      if (!raw) return logout();
      $('listBtn').disabled = true;
      $('blockedBox').hidden = false;
      $('blockedList').value = '';
      $('blockedStatus').textContent = 'Загружаю…';
      const load = (s) => TB.blockedList(s, (n) => { $('blockedStatus').textContent = 'Загружаю… ' + n; });
      try {
        let names;
        try { names = await load(JSON.parse(raw)); }
        catch (e) {
          const s = e instanceof TB.AuthError ? await reloginSession() : null;
          if (!s) throw e;
          names = await load(s);
        }
        $('blockedList').value = names.join('\n');
        $('blockedStatus').textContent = 'Заблокировано аккаунтов: ' + names.length;
      } catch (e) {
        if (e instanceof TB.AuthError) { alert('Сессия истекла. Войдите снова.'); return logout(); }
        $('blockedStatus').textContent = '❌ ' + (e.message || 'ошибка');
      }
      $('listBtn').disabled = false;
    };
    $('copyBtn').onclick = async () => {
      const t = $('blockedList').value;
      try { await navigator.clipboard.writeText(t); $('blockedStatus').textContent += ' — скопировано'; }
      catch (e) { $('blockedList').select(); document.execCommand('copy'); }
    };

    $('block').onclick = async () => {
      const names = parse($('names').value);
      if (!names.length) { $('status').textContent = 'Список пуст'; return; }
      if (names.length > 100 &&
          !confirm(`В списке ${names.length} аккаунтов. Возможен rate-limit со стороны Instagram. Продолжить?`)) return;
      const raw = await Storage.get('session');
      if (!raw) return logout();
      let session = JSON.parse(raw);

      async function relogin() {
        const s = await reloginSession();
        if (!s) return false;
        session = s;
        return true;
      }
      // Поиск Instagram не показывает уже заблокированных вами, поэтому сверяемся со списком заблокированных
      let blockedSet = new Set();
      const blockOne = async (name) => {
        if (blockedSet.has(name.toLowerCase())) { already++; return log(`ℹ️ ${name} — уже заблокирован`); }
        const userId = await TB.findUserId(name, session);
        if (!userId) return log(`❌ ${name} — не найден`);
        if (await TB.block(userId, session)) { ok++; log(`✅ ${name} — заблокирован`); }
        else log(`❌ ${name} — ошибка`);
      };

      window.__busy = true; $('block').disabled = true; $('log').textContent = '';
      $('bar').max = names.length; $('bar').value = 0;
      let done = 0, ok = 0, already = 0;
      $('status').textContent = 'Проверяю список уже заблокированных…';
      try {
        let list;
        try { list = await TB.blockedList(session); }
        catch (e) { if (e instanceof TB.AuthError && (await relogin())) list = await TB.blockedList(session); else throw e; }
        blockedSet = new Set(list.map((n) => n.toLowerCase()));
      } catch (e) { /* список недоступен — блокируем как раньше, просто без проверки «уже заблокирован» */ }
      for (const name of names) {
        $('status').textContent = `${done} / ${names.length}`;
        try {
          try { await blockOne(name); }
          catch (e) {
            if (!(e instanceof TB.AuthError) || !(await relogin())) throw e;
            await blockOne(name); // повтор уже с новой сессией
          }
        } catch (e) {
          if (e instanceof TB.AuthError) {
            alert('Сессия истекла. Войдите снова.');
            return logout();
          }
          log(`❌ ${name} — ${e.message || 'ошибка'}`);
        }
        $('bar').value = ++done;
        await sleep(500);
      }
      $('status').textContent = `Готово: заблокировано ${ok}` + (already ? `, уже были заблокированы ${already}` : '') + ` из ${names.length}`;
      $('block').disabled = false; window.__busy = false;
    };
  </script>
</body>
</html>
